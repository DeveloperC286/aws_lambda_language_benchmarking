name: Continuous Integration (CI)

on: pull_request

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting
    runs-on: ${{ matrix.architecture }}
    strategy:
      matrix:
        architecture: [ubuntu-24.04, ubuntu-24.04-arm]
        directory: [nodejs/aws, nodejs/local]
        language: [nodejs]
    steps:
      - name: Checkout code.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Nix.
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Check formatting.
        run: cd "${{ matrix.directory }}" && nix develop -c make check-${{ matrix.language }}-formatting
